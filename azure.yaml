# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: foundry-call-center
services:
    orchestrator:
        project: src/orchestrator
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            PYTHONNOUSERSITE: "1"
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Intent router that relays to the specialists.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: orchestrator
        protocols:
            - protocol: responses
              version: 2.0.0
    claims-specialist:
        project: src/claims-specialist
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            TOOLS_API_URL: ${TOOLS_API_URL}
            TOOLS_API_AUDIENCE: ${TOOLS_API_AUDIENCE}
            SEARCH_ENDPOINT: ${SEARCH_ENDPOINT}
            KNOWLEDGE_BASE_NAME: kb-claims
            PYTHONNOUSERSITE: "1"
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Claims specialist for the call center.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: claims-specialist
        protocols:
            - protocol: responses
              version: 2.0.0
    appointments-specialist:
        project: src/appointments-specialist
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            TOOLS_API_URL: ${TOOLS_API_URL}
            TOOLS_API_AUDIENCE: ${TOOLS_API_AUDIENCE}
            SEARCH_ENDPOINT: ${SEARCH_ENDPOINT}
            KNOWLEDGE_BASE_NAME: kb-appointments
            PYTHONNOUSERSITE: "1"
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Appointments specialist for the call center.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: appointments-specialist
        protocols:
            - protocol: responses
              version: 2.0.0
    pharmacy-specialist:
        project: src/pharmacy-specialist
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            TOOLS_API_URL: ${TOOLS_API_URL}
            TOOLS_API_AUDIENCE: ${TOOLS_API_AUDIENCE}
            SEARCH_ENDPOINT: ${SEARCH_ENDPOINT}
            KNOWLEDGE_BASE_NAME: kb-pharmacy
            PYTHONNOUSERSITE: "1"
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Pharmacy specialist for the call center.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: pharmacy-specialist
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-4.1-mini
                version: "2025-04-14"
              name: gpt-4.1-mini
              sku:
                capacity: 100
                name: GlobalStandard
infra:
    provider: microsoft.foundry
